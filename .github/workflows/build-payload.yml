name: build-payload
# Feedstock build: recipe → per-triplet legs → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
#
# STATUS:
#   aarch64-macos — green: build + boot smoke; tags publish.
#   x86_64-windows-ucrt — the BUILD is green (staging incl. the brotli
#   native build, image, manifest). The boot smoke is pinned to a KNOWN
#   runtime-layer blocker: current windows-ucrt64 runtimes cannot load
#   dynamically linked native extensions at all — the interpreter is
#   --disable-shared/--with-static-linked-ext, exports no symbols, and
#   the release ships no ruby DLL, so nokogiri/ffi/brotli .so files have
#   nothing to bind to (docs/build-notes.md § Windows). tools/smoke_verdict
#   turns exactly that signature green and fails any other failure mode;
#   NO windows artifact publishes until the runtime factory ships a
#   symbol provider and the gate here is enforced.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.1, sha256-pinned)
        # The packager is the RELEASE BINARY (releases are the
        # interface); v0.1.1 predates the release's SHA256SUMS asset, so
        # the digests are pinned here (provenance: docs/build-notes.md).
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.1"
          curl -sLO "$base/tebako-0.1.1-macos-arm64"
          curl -sLO "$base/tfs-0.1.1-macos-arm64"
          echo "025fdf6948ab678895004349c7ada9c4a13676de5d1eb71bdac40dedcae73d84  tebako-0.1.1-macos-arm64" > SHA256PINS
          echo "b1848bda4d12ec520faa682adf293f58e07ba6fedc28e373911cff24e56fe412  tfs-0.1.1-macos-arm64" >> SHA256PINS
          shasum -a 256 -c SHA256PINS
          chmod 755 tebako-0.1.1-macos-arm64 tfs-0.1.1-macos-arm64
          mv tebako-0.1.1-macos-arm64 tebako
          mv tfs-0.1.1-macos-arm64 tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Fetch factory tools (tamatebako/libtfs v0.13.0, SHA256SUMS-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/factory-tools" && cd "$RUNNER_TEMP/factory-tools"
          base="https://github.com/tamatebako/libtfs/releases/download/v0.13.0"
          curl -sLO "$base/SHA256SUMS"
          curl -sLO "$base/mkdwarfs-macos-arm64"
          grep "mkdwarfs-macos-arm64" SHA256SUMS | shasum -a 256 -c -
          chmod 755 mkdwarfs-macos-arm64
          echo "$RUNNER_TEMP/factory-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        env:
          TEBAKO_CLI: tebako
          MKDWARFS: mkdwarfs-macos-arm64
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's --version
        # runs from the image before any release publishes.
        env:
          TFS: tfs
        run: |
          . out/aarch64-macos/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/aarch64-macos/fontist-3.0.10-aarch64-macos.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  build-windows:
    name: x86_64-windows-ucrt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 (ucrt64 toolchain for the ruby SDK + brotli)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            make
            patch
            mingw-w64-ucrt-x86_64-toolchain

      - name: Fetch tebako CLI tools (tamatebako/tebako v0.1.1, sha256-pinned)
        shell: msys2 {0}
        run: |
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v0.1.1"
          curl -sLO "$base/tebako-0.1.1-windows-ucrt64.exe"
          curl -sLO "$base/tfs-0.1.1-windows-ucrt64.exe"
          echo "9cd4f2e0922acb776797a284f2f3ea1448f93c228c92e84b0f1f7a322857c2b8  tebako-0.1.1-windows-ucrt64.exe" > SHA256PINS
          echo "82ed22135321449c81530e1fabeba73555195ea411e0d9cca4458a23fe5ad01c  tfs-0.1.1-windows-ucrt64.exe" >> SHA256PINS
          sha256sum -c SHA256PINS
          cp tebako-0.1.1-windows-ucrt64.exe tebako.exe
          cp tfs-0.1.1-windows-ucrt64.exe tfs.exe
          echo "TEBAKO_TOOLS=$(cygpath -m "$RUNNER_TEMP/tebako-tools")" >> "$GITHUB_ENV"

      - name: Build the payload
        shell: msys2 {0}
        env:
          TRIPLET: x86_64-windows-ucrt
        run: |
          export TEBAKO_CLI="$TEBAKO_TOOLS/tebako.exe"
          export TFS="$TEBAKO_TOOLS/tfs.exe"
          tools/build

      - name: Boot-smoke + verdict
        # The in-image assertions and the extract round-trip are hard
        # gates. The exec leg is pinned to the KNOWN windows runtime-
        # layer blocker (header comment): only its exact LoadError
        # signature is accepted as green; a PASS or any other failure
        # mode is reported by tools/smoke_verdict (pass flips the gate,
        # anything else fails the leg).
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          set +e
          TFS="$TEBAKO_TOOLS/tfs.exe" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/x86_64-windows-ucrt/fontist-3.0.10-x86_64-windows-ucrt.tfs \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          tools/smoke_verdict "$rc" "$RUNNER_TEMP/smoke.log"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-windows-ucrt
          path: out/x86_64-windows-ucrt/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - name: Publish payloads + registry
        # artifacts per triplet + SHA256SUMS + the resolved tpkg-registry.yaml
        run: tools/publish 3.0.10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
