name: build-payload
# Feedstock build: recipe → per-triplet legs → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
#
# STATUS:
#   aarch64-macos — green: build + boot smoke; tags publish.
#   x86_64-windows-ucrt — build + boot smoke ENFORCED: the pinned
#   runtime line carries the windows runtime-layer fixes the
#   exec gate waited on (the ruby DLL facet + the loader interpose /
#   library_aliases — spec 22 phase W2), so tools/smoke_verdict runs
#   fail-closed: ANY boot-smoke failure fails the leg. Tags publish the
#   windows artifact together with the mac leg (docs/build-notes.md
#   § Windows).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: aarch64-macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch tebako CLI tools (tamatebako/tebako v2.8.21, sha256-pinned)
        # The packager is the RELEASE BINARY (releases are the
        # interface); the digests are pinned here and cross-checked
        # against the release's SHA256SUMS (provenance: docs/build-notes.md).
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.21"
          curl -sLO "$base/tebako-2.8.21-macos-arm64"
          curl -sLO "$base/tfs-2.8.21-macos-arm64"
          curl -sLO "$base/SHA256SUMS"
          echo "e6269526d268f5ef0b6718fbbde02efe7c957733adca9971c755ad544710f6a2  tebako-2.8.21-macos-arm64" > SHA256PINS
          echo "38f4493c1a65d37ace603db171c23d9a4580bd6053e3a3007800fbcf7a494d83  tfs-2.8.21-macos-arm64" >> SHA256PINS
          shasum -a 256 -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          while read -r want asset; do
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: pinned=$want release=${got:-ABSENT}"; exit 1; }
          done < SHA256PINS
          chmod 755 tebako-2.8.21-macos-arm64 tfs-2.8.21-macos-arm64
          mv tebako-2.8.21-macos-arm64 tebako
          mv tfs-2.8.21-macos-arm64 tfs
          echo "$RUNNER_TEMP/tebako-tools" >> "$GITHUB_PATH"

      - name: Build the payload
        # The mac leg images with the same pinned tfs CLI (fetched above,
        # on PATH) — no factory-tool download anywhere in this workflow.
        env:
          TEBAKO_CLI: tebako
        run: tools/build

      - name: Boot-smoke
        # Hard rule (docs/conventions.md): the packaged tool's --version
        # runs from the image before any release publishes.
        env:
          TFS: tfs
        run: |
          . out/aarch64-macos/runtime.env
          TFS="$TFS" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/aarch64-macos/fontist-3.0.10-aarch64-macos.tfs

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-aarch64-macos
          path: out/aarch64-macos/

  build-windows:
    name: x86_64-windows-ucrt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSYS2 (ucrt64 toolchain for the ruby SDK + brotli)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: ucrt64
          path-type: minimal
          # ucrt64 ruby: the build's read-back step parses the shipped
          # manifest as YAML (the macOS leg uses the system ruby).
          install: >-
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ruby

      - name: Fetch tebako CLI tools (tamatebako/tebako v2.8.21, sha256-pinned)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tebako-tools" && cd "$RUNNER_TEMP/tebako-tools"
          base="https://github.com/tamatebako/tebako/releases/download/v2.8.21"
          curl -sLO "$base/tebako-2.8.21-windows-ucrt64.exe"
          curl -sLO "$base/tfs-2.8.21-windows-ucrt64.exe"
          curl -sLO "$base/SHA256SUMS"
          echo "b2b98454c626020c50288818568d0e743c0dc7a8d57cdf91d8a8d48489eafdad  tebako-2.8.21-windows-ucrt64.exe" > SHA256PINS
          echo "e5128ef8be90813bf9300dda39f204fff39f6d1e3eb4963128cbdfaeed88744a  tfs-2.8.21-windows-ucrt64.exe" >> SHA256PINS
          sha256sum -c SHA256PINS
          # The pins must agree with the release's own sums (both anchored).
          while read -r want asset; do
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: pinned=$want release=${got:-ABSENT}"; exit 1; }
          done < SHA256PINS
          cp tebako-2.8.21-windows-ucrt64.exe tebako.exe
          cp tfs-2.8.21-windows-ucrt64.exe tfs.exe
          echo "TEBAKO_TOOLS=$(cygpath -m "$RUNNER_TEMP/tebako-tools")" >> "$GITHUB_ENV"

      - name: Build the payload
        shell: msys2 {0}
        env:
          TRIPLET: x86_64-windows-ucrt
        run: |
          export TEBAKO_CLI="$TEBAKO_TOOLS/tebako.exe"
          export TFS="$TEBAKO_TOOLS/tfs.exe"
          tools/build

      - name: Boot-smoke + verdict
        # Fully enforcing (header comment): on the pinned runtime line
        # the exec leg must PASS — tools/smoke_verdict fails the leg on
        # ANY nonzero rc, classifying the old LoadError signature as a
        # named runtime regression vs. an undiagnosed failure.
        shell: msys2 {0}
        run: |
          . out/x86_64-windows-ucrt/runtime.env
          set +e
          TFS="$TEBAKO_TOOLS/tfs.exe" RUNTIME="$RUNTIME" RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            tools/boot_smoke out/x86_64-windows-ucrt/fontist-3.0.10-x86_64-windows-ucrt.tfs \
            2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          set -e
          tools/smoke_verdict "$rc" "$RUNNER_TEMP/smoke.log"

      - name: Stage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-x86_64-windows-ucrt
          path: out/x86_64-windows-ucrt/

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    # Both legs publish: the windows boot smoke runs enforcing on the
    # pinned runtime line, so the wiring (needs + tools/publish's triplet list +
    # the registry entry) includes the windows artifact.
    needs: [build, build-windows]
    # attestations/id-token arm the SLSA L3 provenance step at the job
    # tail (same tag gate — push/PR runs never run this job, so they
    # never attest).
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: out
          merge-multiple: false
      - name: Restore layout
        # each dist-<triplet> artifact carries the leg's out/<triplet>/
        # contents; put them back at out/<triplet>/ for tools/publish
        run: |
          set -e
          for d in out/dist-*/; do
            p="${d#out/dist-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      - name: Publish payloads + registry
        # artifacts per triplet + SHA256SUMS + the resolved tpkg-registry.yaml
        # (tools/publish regenerates the repo-root registry in the current
        # grammar, upserting the published version); spec 09 §9 signing is
        # declared in Tebakofile, so the org secret must be installed — an
        # empty key on a tag push fails the publish.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEBAKO_SIGNING_KEY: ${{ secrets.TEBAKO_CI_SIGNING_KEY }}
        run: tools/publish

      # SLSA L3 provenance over the exact bytes this tag ships —
      # enumerated to match tools/publish's upload set: the per-triplet
      # .tfs images + .manifest.yaml sidecars, the detached .asc set
      # (next to each signed input when the recipe signs), and the
      # SHA256SUMS + tpkg-registry.yaml trust anchors (the registry is a
      # release asset here AND lands on main via the PR below). Gated
      # with the job (tag runs only); push/PR runs never attest.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*/*.tfs
            out/*/*.manifest.yaml
            out/*/*.asc
            out/SHA256SUMS
            out/SHA256SUMS.asc
            tpkg-registry.yaml
            tpkg-registry.yaml.asc
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          # The CI PAT authors the PR: a GITHUB_TOKEN-authored PR's checks
          # sit on the approval queue until they expire red.
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (aarch64-macos, x86_64-windows-ucrt)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"

  ping-registry:
    # The official registry's 6-hourly aggregate is the self-healing
    # backstop; this reusable ping (tebako-packages/registry) makes a
    # same-day publish visible there immediately. Never fatal.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    uses: tebako-packages/registry/.github/workflows/ping-aggregate.yml@main
    secrets: inherit
